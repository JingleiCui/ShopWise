spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:48}
server.port=${PORT:18081}
server.address=${BIND_ADDRESS:127.0.0.1}
spring.datasource.url=${DB_URL:jdbc:postgresql://127.0.0.1:15439/shopwise}
spring.datasource.username=${DB_USER:shopwise}
spring.datasource.password=${DB_PASSWORD:shopwise}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.timeout=8h
spring.session.jdbc.initialize-schema=never
spring.jackson.deserialization.fail-on-null-for-primitives=true
