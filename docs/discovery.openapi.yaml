openapi: 3.1.0
info:
  title: ShopWise discovery and merchant pilot
  version: 1.0.0
paths:
  /api/v1/discovery:
    get:
      parameters:
        - {in: query, name: q, required: true, schema: {type: string, minLength: 1, maxLength: 120}}
        - {in: query, name: budget, schema: {type: number, minimum: 0}}
      responses:
        '200':
          description: China destination candidates grouped by source. Budget applies to known merchandise prices.
          content:
            application/json:
              schema:
                type: object
                required: [destination, shippingStatus, taxStatus, sources]
                properties:
                  destination: {const: CN}
                  shippingStatus: {const: UNKNOWN}
                  taxStatus: {const: UNKNOWN}
                  sources: {type: array, items: {$ref: '#/components/schemas/Source'}}
                  matches:
                    type: array
                    items:
                      type: object
                      properties:
                        evidence: {enum: [GTIN, BRAND_MPN]}
                        offers: {type: array, items: {type: string}}
        '400': {description: Invalid query or budget}
  /api/v1/discovery/{provider}/{operation}:
    get:
      parameters:
        - {in: path, name: provider, required: true, schema: {enum: [shopify, ebay]}}
        - {in: path, name: operation, required: true, schema: {enum: [lookup, details]}}
        - {in: query, name: id, required: true, schema: {type: string, minLength: 1, maxLength: 220}}
      responses:
        '200':
          description: Current scoped variant status
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Source'}
        '400': {description: Invalid source or reference}
  /api/v1/assistant/turn:
    post:
      parameters:
        - {in: header, name: X-CSRF-TOKEN, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message: {type: string, minLength: 1, maxLength: 400}
      responses:
        '200':
          description: Status and message events. The message carries text, filters and live offers. An upstream failure emits an error event.
          content:
            text/event-stream:
              schema: {type: string}
        '403': {description: Missing or invalid session-bound CSRF token}
        '409': {description: A turn is already active for the session}
        '429': {description: Search allowance exhausted}
  /api/v1/merchant/checkout:
    post:
      description: Bound pilot buyer previews a fresh hosted cart. No checkout URL is exposed yet.
      parameters:
        - {in: header, name: X-CSRF-TOKEN, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requestId, items]
              properties:
                requestId: {type: string, format: uuid}
                items:
                  type: array
                  minItems: 1
                  maxItems: 15
                  items:
                    type: object
                    required: [variantId, quantity]
                    properties:
                      variantId: {type: string}
                      quantity: {type: integer, minimum: 1, maximum: 20}
      responses:
        '200': {description: Short-lived merchant quote with original currency and finalTotal false}
        '403': {description: Buyer identity or CSRF verification failed}
        '409': {description: Variant availability or request changed}
        '503': {description: Merchant checkout disabled}
  /api/v1/merchant/checkout/{id}/confirm:
    post:
      parameters:
        - {in: path, name: id, required: true, schema: {type: string, format: uuid}}
        - {in: header, name: X-CSRF-TOKEN, required: true, schema: {type: string}}
      responses:
        '200': {description: Fresh merchant checkoutUrl}
        '409': {description: Quote changed or expired}
  /api/v1/merchant/orders:
    get:
      responses:
        '200': {description: Order view scoped to the bound merchant identity}
  /api/v1/merchant/returns:
    get:
      responses:
        '200': {description: Return requests belonging to the signed-in buyer}
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requestId, orderId, lineId, quantity, reason]
              properties:
                requestId: {type: string, format: uuid}
                orderId: {type: string}
                lineId: {type: string}
                quantity: {type: integer, minimum: 1, maximum: 999}
                reason: {type: string, minLength: 1, maxLength: 800}
      responses:
        '200': {description: Created or replayed return request}
        '404': {description: Order is unavailable to this buyer}
        '409': {description: Non-returnable order, insufficient quantity or reused request ID}
  /api/v1/merchant/staff/returns/{id}/{action}:
    post:
      parameters:
        - {in: path, name: id, required: true, schema: {type: string, format: uuid}}
        - {in: path, name: action, required: true, schema: {enum: [approve, decline, receive, reconcile]}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                note: {type: [string, 'null'], maxLength: 800}
                refundId: {type: [string, 'null']}
      responses:
        '200': {description: Updated or replayed status. Reconciliation only reads a successful existing Shopify refund.}
        '403': {description: Staff lacks shop access}
        '409': {description: Invalid transition, missing proof of successful refund or already-used receipt}
components:
  schemas:
    Source:
      type: object
      required: [provider, status, offers]
      properties:
        provider: {enum: [shopify, ebay]}
        status: {enum: [ok, empty, disabled, busy, timeout, unavailable]}
        offers: {type: array, items: {$ref: '#/components/schemas/Offer'}}
    Offer:
      type: object
      required: [provider, productId, variantId, title, source, url, destination, observedAt]
      properties:
        provider: {type: string}
        productId: {type: string}
        variantId: {type: string}
        title: {type: string}
        source: {type: string}
        url: {type: string, format: uri}
        currency: {type: [string, 'null']}
        amountMinor: {type: [integer, 'null']}
        price: {type: [number, 'null']}
        available: {type: [boolean, 'null']}
        destination: {const: CN}
        observedAt: {type: string, format: date-time}
        referenceCny:
          type: [object, 'null']
          properties:
            amount: {type: number}
            date: {type: string, format: date}
